<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Huskeliste</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#F4F6F1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Huskeliste" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; }
:root {
  --bg: #F4F6F1;
  --bg-2: #ECF0E8;
  --seg: #E4EADF;
  --surface: #FFFFFF;
  --ink: #23312A;
  --ink-2: #4A5A51;
  --muted: #7E8C85;
  --line: #E0E6DC;
  --line-2: #CDD6C8;
  --check: #B9C4BC;
  --accent: #3F6B54;
  --accent-2: #335A46;
  --accent-soft: #DCE9E1;
  --accent-tint: #EEF5F0;
  --warm: #C97A46;
  --warm-ink: #8A4A21;
  --warm-soft: #F5E3D5;
  --warm-tint: #FCF5EF;
  --gen: #4F6FA5;
  --gen-ink: #34507F;
  --gen-soft: #D6E0F0;
  --gen-tint: #EFF3FA;
  --danger: #B9503A;
  --danger-soft: #F7E3DD;
  --sh-xs: 0 1px 1px rgba(35,49,42,.04);
  --sh-sm: 0 1px 2px rgba(35,49,42,.06), 0 2px 6px rgba(35,49,42,.05);
  --sh-md: 0 10px 30px rgba(35,49,42,.12), 0 2px 6px rgba(35,49,42,.06);
}
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px; line-height: 1.4; color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
body.sheet-open { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.ic { width: 18px; height: 18px; flex-shrink: 0; display: block; }

/* ---------- Toppfelt ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(244,246,241,.9);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.topbar-inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: 'Fraunces', Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(63,107,84,.3); }
.logo .ic { width: 18px; height: 18px; }
.views { display: flex; background: var(--seg); border-radius: 999px; padding: 3px; gap: 2px; margin: 0 auto; }
.views button { border: 0; background: transparent; padding: 7px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); transition: background .15s, color .15s; }
.views button:hover { color: var(--ink); }
.views button.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--sh-sm); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); transition: border-color .15s, background .15s; }
.pill:hover { border-color: var(--line-2); color: var(--ink); }
.pill .ic { width: 17px; height: 17px; color: var(--accent); }
.pill.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
.pill.is-active .ic { color: #fff; }
.badge { min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; padding: 0 6px; }
.pill.is-active .badge { background: rgba(255,255,255,.22); color: #fff; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); padding: 0; transition: background .15s, color .15s, border-color .15s; }
.icon-btn:hover { color: var(--accent); border-color: var(--line-2); }
.icon-btn.ghost { border-color: transparent; background: transparent; }
.icon-btn.ghost:hover { background: var(--bg-2); }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 8px; }
.icon-btn.sm .ic { width: 16px; height: 16px; }

/* ---------- Innhold ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding: 4px 16px calc(110px + env(safe-area-inset-bottom)); }
.narrow { max-width: 760px; margin-left: auto; margin-right: auto; }
.toolbar { display: flex; align-items: center; gap: 10px; margin: 16px 0 12px; min-height: 40px; }
.toolbar.narrow { margin-left: auto; margin-right: auto; }
.nav-group { display: flex; gap: 6px; }
.period { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.period-main { font-family: 'Fraunces', Georgia, serif; font-size: 25px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
.period-sub { color: var(--muted); font-size: 14px; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; transition: border-color .15s, background .15s, color .15s; }
.btn:hover { border-color: var(--line-2); color: var(--ink); }
.btn .ic { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-2); }
.btn.warm { background: var(--warm); border-color: var(--warm); color: #fff; }
.btn.wide { width: 100%; justify-content: center; padding: 10px 12px; }
.btn:disabled { opacity: .55; cursor: default; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; flex: 1; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-tint); }
.search .ic { color: var(--muted); }
.search input { border: 0; outline: 0; background: transparent; flex: 1; padding: 10px 0; font-size: 16px; min-width: 0; }
.search input::-webkit-search-cancel-button { cursor: pointer; }

/* Hurtig-legg-til */
.quickadd { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 12px; box-shadow: var(--sh-sm); transition: border-color .15s, box-shadow .15s; margin-bottom: 4px; }
.quickadd:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-tint), var(--sh-sm); }
.qa-icon { color: var(--accent); display: grid; place-items: center; }
.quickadd input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; padding: 9px 0; }
.quickadd input::placeholder { color: #9AA69F; }
.qa-date { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; transition: border-color .15s; }
.qa-date:hover { border-color: var(--accent); color: var(--accent); }
.qa-date .ic { width: 16px; height: 16px; }
.qa-submit { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: background .15s, opacity .15s; }
.qa-submit:hover { background: var(--accent-2); }
.qa-submit .ic { display: none; }

/* Bannere */
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-radius: 12px; padding: 9px 10px 9px 13px; margin-top: 12px; font-size: 14px; }
.banner > .ic { width: 18px; height: 18px; }
.banner .b-text { flex: 1; min-width: 180px; }
.banner .b-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.banner.warn { background: var(--warm-tint); border: 1px solid #F0DAC7; color: var(--warm-ink); }
.banner.info { background: var(--accent-tint); border: 1px solid var(--accent-soft); color: var(--accent-2); }
.banner.error { background: var(--danger-soft); border: 1px solid #EBC5BA; color: #7E2F1F; }
.banner .btn { padding: 6px 10px; }

.loading { padding: 60px 0; text-align: center; color: var(--muted); }

/* ---------- Oppgavekort ---------- */
.task {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 9px 10px; box-shadow: var(--sh-xs); cursor: pointer; position: relative;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y;
  transition: border-color .15s, box-shadow .15s, opacity .25s, background .2s;
}
.task:hover { border-color: var(--line-2); box-shadow: var(--sh-sm); }
.task:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.check {
  flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; padding: 0; margin-top: -1px;
  border: 2px solid var(--check); background: var(--surface); color: transparent;
  display: grid; place-items: center; position: relative;
  transition: border-color .15s, background .15s, color .15s, transform .15s;
}
.check::before { content: ""; position: absolute; inset: -9px; }
.check .ic { width: 13px; height: 13px; }
.check:hover { border-color: var(--accent); color: #C9DCD0; }
.is-done > .check, .is-done .check { background: var(--accent); border-color: var(--accent); color: #fff; }
.t-body { flex: 1; min-width: 0; }
.t-title { font-size: 14.5px; font-weight: 500; line-height: 1.35; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.is-done .t-title { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(126,140,133,.55); }
.t-meta { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-top: 4px; color: var(--muted); font-size: 12.5px; align-items: center; }
.t-meta span { display: inline-flex; align-items: center; gap: 4px; }
.t-meta .ic { width: 14px; height: 14px; }
.task.is-overdue { box-shadow: inset 3px 0 0 var(--warm), var(--sh-xs); }
.task.is-overdue .m-date { color: var(--warm); font-weight: 600; }
.task.just-done { opacity: .7; }
.t-time { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--accent); background: var(--accent-tint); border-radius: 6px; padding: 1px 6px; margin-right: 7px; font-variant-numeric: tabular-nums; vertical-align: 1px; text-decoration: none; }
.is-done .t-time { color: var(--muted); background: var(--bg-2); }
.task.is-general { background: var(--gen-tint); border-color: var(--gen-soft); box-shadow: inset 3px 0 0 var(--gen), var(--sh-xs); }
.task.is-general .check { border-color: #A8B9D8; background: #fff; }
.task.is-general.is-done .check { background: var(--gen); border-color: var(--gen); }
.day-general { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; border-radius: 10px; }
.gen-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--gen-ink); padding: 0 3px; display: flex; align-items: center; gap: 5px; }
.gen-label .ic { width: 13px; height: 13px; }
.g-general .group-h { color: var(--gen-ink); }
.t-del { position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 8px; border: 0; padding: 0; background: var(--surface); color: var(--muted); display: none; place-items: center; box-shadow: var(--sh-sm); }
.t-del .ic { width: 15px; height: 15px; }
.t-del:hover { color: var(--danger); background: var(--danger-soft); }
@media (hover: hover) and (pointer: fine) {
  .task:hover .t-del { display: grid; }
}
body.is-dragging .t-del, .drag-ghost .t-del { display: none !important; }
.day-list, .g-list, .day-general { position: relative; }
.swipe-bg { position: absolute; border-radius: 12px; background: #E9C3B9; color: #fff; display: flex; align-items: center; justify-content: flex-end; gap: 7px; padding-right: 18px; font-weight: 700; font-size: 14px; z-index: 0; transition: background .15s; }
.swipe-bg .ic { width: 18px; height: 18px; }
.swipe-bg.armed { background: var(--danger); }
.task.swiping { transition: none; z-index: 1; }
.task.swipe-back { transition: transform .2s ease; z-index: 1; }
.task.swipe-out { transition: transform .2s ease, opacity .2s ease; opacity: 0; z-index: 1; }
.task.just-done .check { animation: pop .45s ease; }
@keyframes pop { 0% { transform: scale(.7); } 55% { transform: scale(1.2); } 100% { transform: scale(1); } }

/* ---------- Ukevisning ---------- */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: stretch; margin-top: 14px; }
.day { border-radius: 14px; padding: 10px 7px 8px; min-height: 250px; display: flex; flex-direction: column; border: 1px solid transparent; transition: background .15s, border-color .15s; }
.day.is-today { background: var(--warm-tint); border-color: #F1DECD; }
.day-head { display: flex; align-items: center; gap: 6px; padding: 0 3px 9px; min-height: 36px; }
.dh-desk { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.dh-name { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.dh-num { font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; line-height: 1; }
.is-today .dh-num { background: var(--warm); color: #fff; border-radius: 999px; min-width: 32px; height: 32px; display: grid; place-items: center; font-size: 17px; padding: 0 6px; }
.is-today .dh-name { color: var(--warm-ink); }
.is-past .dh-desk, .is-past .dh-mob { opacity: .55; }
.dh-mob { display: none; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
.dh-long { font-weight: 700; font-size: 15.5px; }
.dh-date { color: var(--muted); font-size: 13.5px; }
.dh-today { font-size: 11.5px; font-weight: 700; color: #fff; background: var(--warm); border-radius: 999px; padding: 2px 8px; align-self: center; }
.dh-panel { flex: 1; font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 600; }
.dh-tools { display: flex; gap: 2px; margin-left: auto; }
.head-add { display: none !important; }
.day-list { display: flex; flex-direction: column; gap: 6px; min-height: 6px; }
.add-btn { margin-top: 6px; border: 0; background: transparent; color: var(--muted); text-align: left; padding: 8px 6px; border-radius: 9px; font-size: 13.5px; font-weight: 500; display: flex; gap: 6px; align-items: center; transition: background .15s, color .15s; }
.add-btn .ic { width: 16px; height: 16px; }
.add-btn:hover { background: rgba(63,107,84,.07); color: var(--accent); }
.inline-add { margin-top: 6px; }
.ia-input { width: 100%; border: 1px solid var(--accent); border-radius: 11px; padding: 9px 11px; font-size: 16px; outline: 0; background: var(--surface); box-shadow: 0 0 0 4px var(--accent-tint); }
.done-toggle { margin-top: 8px; border: 0; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 5px 6px; border-radius: 8px; display: flex; align-items: center; gap: 6px; align-self: flex-start; transition: background .15s, color .15s; }
.done-toggle .ic { width: 15px; height: 15px; }
.done-toggle .chev { width: 14px; height: 14px; transition: transform .2s; }
.done-toggle.is-open .chev { transform: rotate(180deg); }
.done-toggle:hover { color: var(--accent); background: rgba(63,107,84,.07); }
.day-done { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
.day-done .task { background: rgba(255,255,255,.55); box-shadow: none; border-style: dashed; }

.count { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--bg-2); border-radius: 999px; padding: 2px 8px; font-family: 'Inter', sans-serif; }

@media (max-width: 899px) {
  .week { grid-template-columns: 1fr; gap: 8px; }
  .day { min-height: 0; background: var(--surface); border-color: var(--line); padding: 8px 10px 10px; }
  .day.is-today { background: var(--warm-tint); border-color: #EFD7C3; }
  .day.is-empty { padding-bottom: 4px; }
  .day.is-empty .day-list { display: none; }
  .day-head { padding: 0 0 6px; }
  .dh-desk { display: none; }
  .dh-mob { display: flex; }
  .head-add { display: grid !important; }
  .day:not(.panel) > .add-btn { display: none; }
    }

/* ---------- Månedsvisning ---------- */
.m-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; margin-top: 14px; }
.month { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--sh-xs); }
.m-head { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); background: var(--bg-2); }
.m-head span { padding: 8px 4px; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.m-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.m-cell { min-height: 116px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 5px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; background: var(--surface); transition: background .12s; position: relative; }
.m-cell:nth-child(7n) { border-right: 0; }
.m-cell:hover { background: #FAFBF8; }
.m-cell.is-out { background: #F8FAF6; }
.m-cell.is-out .m-num { color: #ADB8B1; }
.m-cell.is-selected { background: var(--accent-tint); box-shadow: inset 0 0 0 2px var(--accent); }
.m-num { font-size: 13px; font-weight: 600; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; flex-shrink: 0; }
.m-cell.is-today .m-num { background: var(--warm); color: #fff; }
.m-chip { font-size: 12px; line-height: 1.3; padding: 3px 6px; border-radius: 6px; background: var(--accent-tint); color: var(--accent-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--accent); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.m-chip:hover { background: var(--accent-soft); }
.m-chip b { font-weight: 700; font-variant-numeric: tabular-nums; }
.m-chip.is-overdue { background: var(--warm-tint); color: var(--warm-ink); border-left-color: var(--warm); }
.m-more { font-size: 11.5px; color: var(--muted); padding-left: 4px; font-weight: 600; }
.m-dots { display: none; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 34px; }
.m-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.m-dot.is-overdue { background: var(--warm); }
.m-done { margin-top: auto; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 3px; font-weight: 600; }
.m-done .ic { width: 12px; height: 12px; }
.m-side { position: sticky; top: 76px; }
.day.panel { background: var(--surface); border: 1px solid var(--line); min-height: 0; padding: 12px 10px 10px; box-shadow: var(--sh-xs); }
.day.panel.is-today { background: var(--warm-tint); }
.day.panel .day-head { padding-bottom: 10px; }
.day.panel .head-add { display: none !important; }
.empty-day { color: var(--muted); font-size: 13.5px; padding: 4px 4px 2px; }
@media (max-width: 1099px) {
  .m-layout { grid-template-columns: 1fr; }
  .m-side { position: static; }
}
@media (max-width: 720px) {
  .m-cell { min-height: 56px; padding: 4px 2px; align-items: center; gap: 4px; }
  .m-chip, .m-more, .m-done { display: none; }
  .m-dots { display: flex; }
  .m-head span { padding: 6px 0; font-size: 11px; letter-spacing: .02em; }
  .m-num { font-size: 13px; }
}

/* ---------- Listevisning ---------- */
.group { margin-top: 20px; border-radius: 14px; transition: background .15s; }
.group-h { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 600; }
.g-overdue .group-h { color: var(--warm-ink); }
.g-list { display: flex; flex-direction: column; gap: 6px; min-height: 6px; }
.empty-mini { color: var(--muted); font-size: 14px; padding: 10px 2px; }
.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty .e-icon { width: 54px; height: 54px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 14px; }
.empty .e-icon .ic { width: 26px; height: 26px; }
.empty h3 { margin: 0 0 6px; color: var(--ink); font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 20px; }

const byOrder = (a, b) => (a.order - b.order) || (a.createdAt - b.createdAt);

function byDay(a, b) {

}

// Henter klokkeslett ut av teksten: «Hent Ronja 17.00», «Øvelse klokken 18.30», «Trening kl 18», «14.40 Lunsj»
function parseTitle(raw) {
  const clean = String(raw || "").replace(/\s+/g, " ").trim();
  const fmt = (h, m) => String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  const ok = (h, m) => h >= 0 && h <= 23 && m >= 0 && m <= 59;
  let m, title = clean, time = null;
  if ((m = clean.match(/^(.*?\S)\s+(?:kl\.?|klokka|klokken)?\s*(\d{1,2})[.:](\d{2})$/i)) && ok(+m[2], +m[3])) { title = m[1]; time = fmt(+m[2], +m[3]); }
  else if ((m = clean.match(/^(.*?\S)\s+(?:kl\.?|klokka|klokken)\s*(\d{1,2})$/i)) && ok(+m[2], 0)) { title = m[1]; time = fmt(+m[2], 0); }
  else if ((m = clean.match(/^(?:kl\.?\s*)?(\d{1,2})[.:](\d{2})\s+(.+)$/i)) && ok(+m[1], +m[2])) { title = m[3]; time = fmt(+m[1], +m[2]); }

}

async function createFirebaseStore() {
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  const [A, F, U] = await Promise.all([
    import(base + "firebase-app.js"),
    import(base + "firebase-firestore.js"),
    import(base + "firebase-auth.js"),
  ]);
  const app = A.initializeApp(firebaseConfig);
  let db;
  try {
    db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  } catch (e) {
    console.warn("Fikk ikke varig lokal buffer, bruker minnebuffer:", e);
    db = F.getFirestore(app);
  }
  const auth = U.getAuth(app);
  let uid = null, hooks = null, unsubs = [];
  let openDocs = new Map(), doneDocs = new Map(), gotOpen = false, gotDone = false;
  const api = { mode: "firebase", cutoff: Date.now() - DONE_WINDOW_DAYS * 864e5 };
  const col = () => F.collection(db, "users", uid, "oppgaver");
  const imgRef = (id) => F.doc(db, "users", uid, "bilder", id);
  const strip = (t) => { const { id, ...rest } = t; return rest; };

  function emit() {
    if (!gotOpen || !gotDone) return;
    const m = new Map(doneDocs);
    openDocs.forEach((v, k) => m.set(k, v));
    hooks.onTasks([...m.values()]);
  }
  function subscribe() {
    unsubs.forEach(f => f()); unsubs = [];
    openDocs = new Map(); doneDocs = new Map(); gotOpen = false; gotDone = false;
    api.cutoff = Date.now() - DONE_WINDOW_DAYS * 864e5;
    const onErr = (e) => hooks.onError(e);
    unsubs.push(F.onSnapshot(F.query(col(), F.where("done", "==", false)), (s) => {
      openDocs = new Map(s.docs.map(d => [d.id, normTask(d.id, d.data())])); gotOpen = true; emit();
    }, onErr));
    unsubs.push(F.onSnapshot(F.query(col(), F.where("doneAt", ">=", api.cutoff)), (s) => {
      doneDocs = new Map(s.docs.map(d => [d.id, normTask(d.id, d.data())])); gotDone = true; emit();
    }, onErr));
  }
  const userInfo = (u) => ({ anon: u.isAnonymous, name: u.email ? u.email.replace(USERNAME_DOMAIN, "") : "" });

  api.start = (h) => {
    hooks = h;
    U.onAuthStateChanged(auth, (user) => {
      if (user) {
        if (user.uid !== uid) { uid = user.uid; hooks.onReset(); subscribe(); }
        hooks.onUser(userInfo(user));
      } else {
        uid = null; unsubs.forEach(f => f()); unsubs = [];
        U.signInAnonymously(auth).catch(e => hooks.onError(e));
      }
    });
  };
  api.put = (t) => F.setDoc(F.doc(col(), t.id), strip(t));
  api.patch = (id, p) => F.updateDoc(F.doc(col(), id), p);
  api.patchMany = (list) => { const b = F.writeBatch(db); list.forEach(c => b.update(F.doc(col(), c.id), c.patch)); return b.commit(); };
  api.remove = (id) => F.deleteDoc(F.doc(col(), id));
  api.putImage = (id, data, taskId) => F.setDoc(imgRef(id), { data, taskId, createdAt: Date.now() });
  api.getImage = async (id) => { const s = await F.getDoc(imgRef(id)); return s.exists() ? s.data().data : null; };
  api.deleteImage = (id) => F.deleteDoc(imgRef(id));
  api.fetchRange = async (a, b) => {
    const s = await F.getDocs(F.query(col(), F.where("date", ">=", a), F.where("date", "<=", b)));
    return s.docs.map(d => normTask(d.id, d.data()));
  };
  api.fetchDoneBefore = async (ms, n) => {
    const parts = [F.where("doneAt", "<", ms), F.orderBy("doneAt", "desc")];
    if (n) parts.push(F.limit(n));
    const s = await F.getDocs(F.query(col(), ...parts));
    return s.docs.map(d => normTask(d.id, d.data()));
  };
  api.secure = async (username, pw) => {
    const cred = U.EmailAuthProvider.credential(toEmail(username), pw);
    const res = await U.linkWithCredential(auth.currentUser, cred);
    hooks.onUser(userInfo(res.user));
  };
  api.login = async (username, pw) => { await U.signInWithEmailAndPassword(auth, toEmail(username), pw); };
  api.logout = async () => { await U.signOut(auth); };
  return api;
}
function toEmail(username) {
  const u = username.trim().toLowerCase();
  return u.includes("@") ? u : u + USERNAME_DOMAIN;
}

function createLocalStore() {
  const KT = "huskeliste:v1:oppgaver", KI = "huskeliste:v1:bilde:";
  let mem = null;
  try { localStorage.setItem("huskeliste:test", "1"); localStorage.removeItem("huskeliste:test"); }
  catch (e) { mem = { tasks: {}, imgs: {} }; }
  const read = () => { if (mem) return mem.tasks; try { return JSON.parse(localStorage.getItem(KT) || "{}") || {}; } catch (e) { return {}; } };
  const write = (o) => { if (mem) { mem.tasks = o; return; } localStorage.setItem(KT, JSON.stringify(o)); };
  const clone = (t) => normTask(t.id, JSON.parse(JSON.stringify(t)));
  let hooks = null, emitQueued = false;
  const api = { mode: "local", cutoff: Date.now() - DONE_WINDOW_DAYS * 864e5 };
  function emit() {
    emitQueued = false;
    const all = Object.values(read());
    hooks.onTasks(all.filter(t => !t.done || (t.doneAt && t.doneAt >= api.cutoff)).map(clone));
  }
  function queue() { if (!emitQueued) { emitQueued = true; setTimeout(emit, 0); } }
  api.start = (h) => {
    hooks = h;
    if (SEED && !Object.keys(read()).length) seedExamples(write);
    h.onUser({ anon: true, local: true });
    queue();
    window.addEventListener("storage", (e) => { if (e.key === KT) queue(); });
  };
  api.put = async (t) => { const o = read(); o[t.id] = JSON.parse(JSON.stringify(t)); write(o); queue(); };
  api.patch = async (id, p) => { const o = read(); if (!o[id]) return; Object.assign(o[id], p); write(o); queue(); };
  api.patchMany = async (list) => { const o = read(); list.forEach(c => { if (o[c.id]) Object.assign(o[c.id], c.patch); }); write(o); queue(); };
  api.remove = async (id) => { const o = read(); delete o[id]; write(o); queue(); };
  api.putImage = async (id, data) => { if (mem) { mem.imgs[id] = data; return; } localStorage.setItem(KI + id, data); };
  api.getImage = async (id) => mem ? (mem.imgs[id] || null) : localStorage.getItem(KI + id);
  api.deleteImage = async (id) => { if (mem) delete mem.imgs[id]; else localStorage.removeItem(KI + id); };
  api.fetchRange = async (a, b) => Object.values(read()).filter(t => t.date && t.date >= a && t.date <= b).map(clone);
  api.fetchDoneBefore = async (ms, n) => {
    let l = Object.values(read()).filter(t => t.done && t.doneAt && t.doneAt < ms).sort((x, y) => y.doneAt - x.doneAt);
    if (n) l = l.slice(0, n);
    return l.map(clone);
  };
  return api;
}

let store = null;

}
function errorText(e) {
  const code = (e && e.code) || "";
  if (code === "permission-denied") return "Appen får ikke lese eller skrive i databasen. Sjekk at Firestore-reglene er publisert i Firebase.";
  if (code === "auth/operation-not-allowed" || code === "auth/admin-restricted-operation") return "Innlogging er ikke slått på i Firebase. Slå på «Anonymous» og «Email/Password» under Authentication → Sign-in method.";
  if (code === "auth/invalid-api-key" || code === "auth/api-key-not-valid.-please-pass-a-valid-api-key.") return "Firebase-nøkkelen i appen er ugyldig. Sjekk firebaseConfig øverst i koden.";
  if (code === "auth/network-request-failed" || code === "unavailable") return "Får ikke kontakt med serveren. Endringer lagres når nettet er tilbake.";
  if (code === "failed-precondition") return "Databasen mangler et oppsett (indeks). Åpne konsollen i nettleseren for en lenke som fikser det.";
  return "Noe gikk galt med lagringen" + (code ? ` (${code})` : "") + ".";
}

function applyLocal(id, patch) {
  for (const m of [S.live, S.older]) { const t = m.get(id); if (t) m.set(id, { ...t, ...patch }); }
}
function update(id, patch, opts = {}) {
  const t = opts.allowDeleted ? rawTask(id) : getTask(id);
  if (!t) return;
  const before = {};
  for (const k in patch) before[k] = t[k] === undefined ? null : t[k];
  const full = { ...patch, updatedAt: Date.now() };
  applyLocal(id, full);
  scheduleRender();
  write(store.patch(id, full));
  if (opts.toast) toast(opts.toast, { undo: () => update(id, before, { allowDeleted: true }), duration: opts.duration });
}
function updateMany(changes, msg) {

    const b = {}; for (const k in c.patch) b[k] = t[k] === undefined ? null : t[k];
    befores.push({ id: c.id, patch: b });
    const p = { ...c.patch, updatedAt: now };
    applyLocal(c.id, p); out.push({ id: c.id, patch: p });
  }
  if (!out.length) return;
  scheduleRender();
  write(store.patchMany(out));
  if (msg) toast(msg, { undo: () => updateMany(befores) });
}

  return Math.floor(m) + 1;
}
function createTask(raw, date) {

  const now = Date.now();
  const t = { id: newId(), title, time, date: date || null, done: false, doneAt: null, notes: "", images: [], order: nextOrder(date), createdAt: now, updatedAt: now, deleted: false, deletedAt: null };
  S.live.set(t.id, t);

}
function toggleDone(id) {

    setTimeout(() => { S.justDone.delete(id); scheduleRender(); }, 950);
    update(id, { done: true, doneAt: Date.now() }, { toast: "Utført", duration: 3500 });
  } else {
    S.justDone.delete(id);
    const msg = S.view === "utfort" && !(S.sheet && S.sheet.kind === "task") ? `Lagt tilbake ${t.date ? "på " + movedLabel(t.date) : "i listen"}` : null;
    update(id, { done: false, doneAt: null }, { toast: msg });

}

}
function setTaskDate(id, rel) {

  else if (rel === "tomorrow") d = addDays(today, 1);
  else if (rel === "+1") d = addDays(t.date || today, 1);
  else if (rel === "+7") d = addDays(t.date || today, 7);

  if (!list.length) return;
  let o = nextOrder(to);
  updateMany(list.map(t => ({ id: t.id, patch: { date: to, order: o++ } })), `${plural(list.length, "oppgave", "oppgaver")} flyttet til ${movedLabel(to)}`);

const deleteTimers = new Map();

// ---------- Bilder ----------
const imgCache = new Map();
async function loadImageSource(file) {
  if ("createImageBitmap" in window) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) {}
  }
  return await new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = (e) => { URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}
function drawScaled(src, maxSide, quality) {
  const w0 = src.naturalWidth || src.width, h0 = src.naturalHeight || src.height;
  const s = Math.min(1, maxSide / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * s)), h = Math.max(1, Math.round(h0 * s));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(src, 0, 0, w, h);
  return { data: c.toDataURL("image/jpeg", quality), w, h };
}
async function compressImage(file) {
  const src = await loadImageSource(file);
  let side = 1600, q = 0.82, full = drawScaled(src, side, q);
  while (full.data.length > 850000 && side > 500) { side = Math.round(side * 0.8); q = Math.max(0.6, q - 0.06); full = drawScaled(src, side, q); }
  const thumb = drawScaled(src, 300, 0.72);
  if (src.close) src.close();
  return { full, thumb };
}
async function addImages(taskId, files) {
  const list = [...files].filter(f => f && f.type && f.type.startsWith("image/"));
  if (!list.length) { toast("Fant ingen bilder i det du la til."); return; }
  for (const f of list) {
    const t0 = getTask(taskId); if (!t0) return;
    if (t0.images.length >= MAX_IMAGES) { toast(`En oppgave kan ha maks ${MAX_IMAGES} bilder.`); return; }
    S.uploading.set(taskId, (S.uploading.get(taskId) || 0) + 1); refreshSheet();
    try {
      const { full, thumb } = await compressImage(f);
      const imgId = newId();
      imgCache.set(imgId, full.data);
      write(store.putImage(imgId, full.data, taskId));
      const t = getTask(taskId);
      if (t) update(taskId, { images: [...t.images, { id: imgId, thumb: thumb.data, w: full.w, h: full.h }] });
    } catch (e) {
      console.error(e); toast("Kunne ikke lese bildet.", { kind: "error" });
    } finally {
      S.uploading.set(taskId, Math.max(0, (S.uploading.get(taskId) || 1) - 1)); refreshSheet();
    }
  }
}
function removeImage(taskId, imgId) {
  const t = getTask(taskId); if (!t) return;
  update(taskId, { images: t.images.filter(i => i.id !== imgId) });
  write(store.deleteImage(imgId));
  imgCache.delete(imgId);
}

// ---------- Hente eldre data ved behov ----------
function cutoffKey() { return addDays(todayKey(), -DONE_WINDOW_DAYS); }
function ensureRange(a, b) {

  const key = a + "|" + b;
  if (S.fetched.has(key)) return;
  S.fetched.add(key);
  store.fetchRange(a, b).then(list => { list.forEach(t => S.older.set(t.id, t)); scheduleRender(); })
    .catch(e => { S.fetched.delete(key); console.warn(e); });
}
async function loadOlderDone(all) {
  if (S.loadingDone || !store) return;
  S.loadingDone = true; renderContent();
  try {
    const cursor = S.doneCursor == null ? store.cutoff : S.doneCursor;
    const n = all ? null : 100;
    const list = await store.fetchDoneBefore(cursor, n);
    list.forEach(t => S.older.set(t.id, t));
    if (list.length) S.doneCursor = Math.min(...list.map(t => t.doneAt));
    if (all || list.length < 100) S.allDoneLoaded = true;
  } catch (e) {

function taskHtml(t, o = {}) {

  if (o.showDate && !t.date && o.showNoDate) meta.push(`<span>${svg("repeat")}Generell</span>`);
  if (t.notes && t.notes.trim()) meta.push(`<span title="Har notater">${svg("notes")}</span>`);
  if (t.images && t.images.length) meta.push(`<span title="${plural(t.images.length, "bilde", "bilder")}">${svg("image")}${t.images.length}</span>`);
  const cls = ["task"];
  if (t.done) cls.push("is-done");
  if (overdue) cls.push("is-overdue");

    `<div class="t-body"><div class="t-title">${t.time ? `<span class="t-time">${t.time}</span>` : ""}${esc(t.title)}</div>${meta.length ? `<div class="t-meta">${meta.join("")}</div>` : ""}</div>` +
    `<button type="button" class="t-del" data-act="del" data-id="${t.id}" aria-label="Slett" title="Slett">${svg("trash")}</button></div>`;
}
function inlineAddHtml(key) {
  if (S.inlineAdd === key) return `<div class="inline-add"><input id="ia-${key}" class="ia-input" data-date="${key}" placeholder="Skriv og trykk Enter" enterkeyhint="done" autocomplete="off" maxlength="300" /></div>`;
  return `<button type="button" class="add-btn" data-act="inline-add" data-date="${key}">${svg("plus")}Legg til</button>`;
}
function doneBlockHtml(key, done) {

  return `<button type="button" class="done-toggle${open ? " is-open" : ""}" data-act="toggle-done-list" data-key="${key}">${svg("done")}${done.length} utført${svg("down", "chev")}</button>` +
    (open ? `<div class="day-done">${done.map(t => taskHtml(t)).join("")}</div>` : "");
}
function generalsFor(k, all) {
  // Generelle oppgaver vises på i dag og kommende dager til de er utført
  const today = todayKey();
  const list = all || allTasks();
  const open = k >= today ? list.filter(t => !t.date && (!t.done || S.justDone.has(t.id))).sort(byOrder) : [];
  const done = list.filter(t => !t.date && t.done && !S.justDone.has(t.id) && t.doneAt && keyOf(new Date(t.doneAt)) === k);
  return { open, done };
}
function dayHtml(k, tasks, o = {}) {
  const today = todayKey(), d = dateOf(k);
  const gen = o.gen || { open: [], done: [] };
  const open = tasks.filter(t => !t.done || S.justDone.has(t.id)).sort(byDay);
  const done = tasks.filter(t => t.done && !S.justDone.has(t.id)).concat(gen.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));

  const head = o.panel
    ? `<span class="dh-panel">${esc(relLong(k))}</span>`
    : `<span class="dh-desk"><span class="dh-name">${WD[(d.getDay() + 6) % 7]}</span><span class="dh-num">${d.getDate()}</span></span>` +
      `<span class="dh-mob"><span class="dh-long">${cap(DAG[d.getDay()])}</span><span class="dh-date">${d.getDate()}. ${MNDK[d.getMonth()]}</span>${k === today ? `<span class="dh-today">I dag</span>` : ""}</span>`;
  const tools = (undone ? `<button type="button" class="icon-btn sm ghost" data-act="push-day" data-date="${k}" title="${pushTitle}" aria-label="${pushTitle}">${svg("push")}</button>` : "") +
    `<button type="button" class="icon-btn sm ghost head-add" data-act="inline-add" data-date="${k}" title="Legg til oppgave" aria-label="Legg til oppgave">${svg("plus")}</button>`;
  const empty = o.panel && !open.length && !gen.open.length && S.inlineAdd !== k ? `<div class="empty-day">Ingen oppgaver denne dagen.</div>` : "";
  const genHtml = gen.open.length ? `<div class="day-general" data-drop-date="" data-list=""><div class="gen-label">${svg("repeat")}Generelt</div>${gen.open.map(t => taskHtml(t)).join("")}</div>` : "";
  return `<section class="${cls.join(" ")}" data-drop-date="${k}">` +
    `<header class="day-head">${head}<span class="dh-tools">${tools}</span></header>` +
    `<div class="day-list" data-list="${k}">${open.map(t => taskHtml(t)).join("")}</div>${genHtml}${empty}` +
    inlineAddHtml(k) + doneBlockHtml(k, done) + `</section>`;
}
function weekHtml() {
  const mon = mondayOf(S.anchor);
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  ensureRange(mon, days[6]);
  const by = new Map(days.map(k => [k, []]));
  const all = allTasks();
  for (const t of all) if (t.date && by.has(t.date)) by.get(t.date).push(t);
  return `<div class="week">${days.map(k => dayHtml(k, by.get(k), { gen: generalsFor(k, all) })).join("")}</div>`;
}
function monthHtml() {
  const a = dateOf(S.anchor), y = a.getFullYear(), m = a.getMonth();
  const first = keyOf(new Date(y, m, 1)), last = keyOf(new Date(y, m + 1, 0));
  const start = mondayOf(first), end = addDays(mondayOf(last), 6);
  ensureRange(start, end);
  const today = todayKey();
  const by = new Map();
  for (const t of allTasks()) {
    if (!t.date || t.date < start || t.date > end) continue;
    if (!by.has(t.date)) by.set(t.date, []);
    by.get(t.date).push(t);
  }
  let cells = "";
  for (let k = start; k <= end; k = addDays(k, 1)) {
    const list = by.get(k) || [];
    const open = list.filter(t => !t.done).sort(byDay);
    const doneN = list.length - open.length;
    const d = dateOf(k);
    const cls = ["m-cell"];
    if (d.getMonth() !== m) cls.push("is-out");
    if (k === today) cls.push("is-today");
    if (k === S.selected) cls.push("is-selected");
    const lim = 3;
    const chips = open.slice(0, lim).map(t => `<div class="m-chip${k < today ? " is-overdue" : ""}" data-task="${t.id}" title="${esc((t.time ? t.time + " " : "") + t.title)}">${t.time ? `<b>${t.time}</b> ` : ""}${esc(t.title)}</div>`).join("");
    const more = open.length > lim ? `<div class="m-more">+${open.length - lim} til</div>` : "";
    const dots = open.slice(0, 4).map(() => `<span class="m-dot${k < today ? " is-overdue" : ""}"></span>`).join("");
    const label = `${longLabel(k)}: ${open.length ? plural(open.length, "oppgave", "oppgaver") : "ingen oppgaver"}`;
    cells += `<div class="${cls.join(" ")}" data-act="select-day" data-date="${k}" data-drop-date="${k}" aria-label="${esc(label)}">` +
      `<div class="m-num">${d.getDate()}</div>${chips}${more}<div class="m-dots">${dots}</div>${doneN ? `<div class="m-done">${svg("check", "", 3)}${doneN}</div>` : ""}</div>`;
  }
  const all = allTasks();
  const sel = all.filter(t => t.date === S.selected);
  return `<div class="m-layout"><div class="month"><div class="m-head">${WD.map(w => `<span>${w}</span>`).join("")}</div><div class="m-grid">${cells}</div></div>` +
    `<div class="m-side">${dayHtml(S.selected, sel, { panel: true, gen: generalsFor(S.selected, all) })}</div></div>`;
}
function matcher(q) {
  q = q.trim().toLowerCase();
  if (!q) return () => true;
  return (t) => t.title.toLowerCase().includes(q) || (t.notes || "").toLowerCase().includes(q);
}
function listHtml() {
  const today = todayKey(), tom = addDays(today, 1);
  const sunThis = addDays(mondayOf(today), 6), monNext = addDays(sunThis, 1), sunNext = addDays(monNext, 6);
  const q = S.search.trim();
  const match = matcher(q);
  const all = allTasks();
  const open = all.filter(t => (!t.done || S.justDone.has(t.id)) && match(t));
  const groups = [
    { key: "overdue", title: "Forfalt", test: t => t.date && t.date < today, showDate: true, sort: byDateOrder },
    { key: "today", title: "I dag", date: today, test: t => t.date === today, always: !q, sort: byDay },
    { key: "tomorrow", title: "I morgen", date: tom, test: t => t.date === tom, sort: byDay },
    { key: "week", title: "Resten av uka", test: t => t.date && t.date > tom && t.date <= sunThis, showDate: true, sort: byDateOrder },
    { key: "next", title: "Neste uke", test: t => t.date && t.date > tom && t.date >= monNext && t.date <= sunNext, showDate: true, sort: byDateOrder },
    { key: "later", title: "Senere", test: t => t.date && t.date > tom && t.date > sunNext, showDate: true, sort: byDateOrder },
    { key: "general", title: "Generelle", date: "", test: t => !t.date },
  ];
  let html = "";
  for (const g of groups) {
    const items = open.filter(g.test).sort(g.sort || byOrder);
    if (!items.length && !g.always) continue;
    const drop = g.date !== undefined ? ` data-drop-date="${g.date}"` : "";
    const list = g.date !== undefined ? ` data-list="${g.date}"` : "";
    html += `<section class="group g-${g.key}"${drop}><h3 class="group-h">${g.title}${items.length ? `<span class="count">${items.length}</span>` : ""}</h3>` +
      `<div class="g-list"${list}>${items.map(t => taskHtml(t, { showDate: g.showDate })).join("")}</div>` +
      (!items.length ? `<div class="empty-mini">Ingenting planlagt i dag.</div>` : "") + `</section>`;
  }
  const doneHits = q ? all.filter(t => t.done && match(t)).length : 0;
  if (!open.length && !q) {
    html = `<div class="empty"><div class="e-icon">${svg("sun")}</div><h3>Alt er gjort!</h3><p>Legg til en ny oppgave i feltet over.</p></div>`;
  } else if (!open.length && q) {
    html = `<div class="empty"><h3>Ingen treff</h3><p>Fant ingen åpne oppgaver som passer «${esc(q)}».</p></div>`;
  }

  if (q && doneHits) foot = `<div class="list-foot">Fant også ${plural(doneHits, "treff", "treff")} blant utførte. <button type="button" class="link-btn" data-act="search-done">Vis</button></div>`;
  else if (!q) {

  }
  return `<div class="narrow">${html}${foot}</div>`;
}
function doneHtml() {
  const q = S.doneSearch.trim();
  const match = matcher(q);
  const list = allTasks().filter(t => t.done && t.doneAt && match(t)).sort((a, b) => b.doneAt - a.doneAt);
  let html = "";
  let curKey = null;
  for (const t of list) {
    const k = keyOf(new Date(t.doneAt));
    if (k !== curKey) {
      if (curKey) html += `</div></section>`;
      curKey = k;
      html += `<section class="done-group"><h3>${esc(relLong(k))}</h3><div class="g-list">`;
    }
    html += taskHtml(t, { showDate: true, showNoDate: true });
  }
  if (curKey) html += `</div></section>`;
  if (!list.length) {
    html = q ? `<div class="empty"><h3>Ingen treff</h3><p>Fant ingen utførte oppgaver som passer «${esc(q)}»${S.allDoneLoaded ? "" : ` de siste ${DONE_WINDOW_DAYS} dagene`}.</p></div>`
      : `<div class="empty"><div class="e-icon">${svg("done")}</div><h3>Ingen utførte oppgaver ennå</h3><p>Når du krysser av en oppgave, havner den her.</p></div>`;
  }

    html += `<div class="more-done"><button type="button" class="btn" data-act="load-done"${S.loadingDone ? " disabled" : ""}>${S.loadingDone ? "Henter …" : "Vis eldre utførte"}</button>` +
      (q ? `<button type="button" class="btn primary" data-act="load-all-done"${S.loadingDone ? " disabled" : ""}>Søk i alle utførte</button>` : "") + `</div>`;
    if (S.doneCursor == null) html += `<div class="done-hint">Viser utførte oppgaver fra de siste ${DONE_WINDOW_DAYS} dagene.</div>`;
  }
  return `<div class="narrow">${html}</div>`;
}

function validUsername(u) { return /^[a-z0-9._-]{3,30}$/.test(u.trim().toLowerCase()); }

  S.accountBusy = true; renderMenuSheet();
  try {
    if (isSecure) { await store.secure(user, pass); S.accountMsg = "Kontoen er laget. Bruk brukernavnet og passordet når du logger inn på andre enheter."; }

}

function openLightbox(taskId, imgId) {

    .map(l => l.replace(/^\s*(?:\d{1,3}[.)]|[-*•–])\s+/, "").trim())
    .filter(Boolean);
  let n = 0;

  if (n) toast(`${plural(n, "oppgave", "oppgaver")} lagt til ${date ? (diffDays(todayKey(), date) <= 1 && diffDays(todayKey(), date) >= 0 ? movedLabel(date) : "på " + movedLabel(date)) : "som generelle"}`);

// =====================================================================
//  DRA OG SLIPP (mus og berøring)
// =====================================================================
const DRAG = { cand: null, active: false, id: null, src: null, ghost: null, zone: null, list: null, line: null, offX: 0, offY: 0, x: 0, y: 0, raf: 0, origPrev: null, origNext: null, origDate: null };
const SW = { active: false, el: null, bg: null, id: null, x0: 0, dx: 0, w: 0 };
let suppressClick = false;
function blockClick() { suppressClick = true; setTimeout(() => { suppressClick = false; }, 80); }

document.addEventListener("pointerdown", (e) => {
  if (DRAG.active || SW.active) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const src = e.target.closest("[data-task]");
  if (!src || src.closest(".sheet") || S.view === "utfort") return;
  if (e.target.closest(".check, .t-del, input, textarea")) return;
  const c = { id: src.dataset.task, el: src, x: e.clientX, y: e.clientY, pid: e.pointerId, type: e.pointerType, timer: 0 };
  DRAG.cand = c;
  // Berøring: hold fingeren litt for å dra (slik at vanlig rulling fortsatt virker)
  if (e.pointerType !== "mouse") c.timer = setTimeout(() => { if (DRAG.cand === c) startDrag(c.x, c.y); }, 330);
});
document.addEventListener("pointermove", (e) => {
  if (DRAG.active) { DRAG.x = e.clientX; DRAG.y = e.clientY; moveDrag(); return; }
  if (SW.active) { moveSwipe(e.clientX); return; }
  const c = DRAG.cand;
  if (!c || e.pointerId !== c.pid) return;
  const dx = e.clientX - c.x, dy = e.clientY - c.y, dist = Math.hypot(dx, dy);
  if (c.type !== "mouse") {
    // Sveip mot venstre = slett
    if (dx < -12 && Math.abs(dx) > Math.abs(dy) * 1.4 && c.el.classList.contains("task")) { startSwipe(c, e.clientX); return; }
    if (dist > 10) cancelCand();
  } else if (dist > 6) { startDrag(e.clientX, e.clientY); }
});
document.addEventListener("pointerup", () => { if (DRAG.active) endDrag(true); else if (SW.active) endSwipe(false); else cancelCand(); });
document.addEventListener("pointercancel", () => { if (DRAG.active) endDrag(false); else if (SW.active) endSwipe(true); else cancelCand(); });
document.addEventListener("touchmove", (e) => { if (DRAG.active || SW.active) e.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", (e) => { if (DRAG.active || SW.active || (DRAG.cand && DRAG.cand.type !== "mouse")) e.preventDefault(); });
document.addEventListener("click", (e) => { if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; } }, true);

function cancelCand() { if (DRAG.cand) { clearTimeout(DRAG.cand.timer); DRAG.cand = null; } }

// ---------- Sveip for å slette ----------
function startSwipe(c, x) {
  clearTimeout(c.timer); DRAG.cand = null;
  const el = c.el, list = el.parentElement;
  if (!list || !getTask(c.id)) return;
  S.renderBlocked = true;
  const bg = document.createElement("div");
  bg.className = "swipe-bg";
  bg.innerHTML = `${svg("trash")}<span>Slett</span>`;
  bg.style.top = el.offsetTop + "px"; bg.style.height = el.offsetHeight + "px";
  bg.style.left = el.offsetLeft + "px"; bg.style.width = el.offsetWidth + "px";
  list.insertBefore(bg, el);
  el.classList.add("swiping");
  Object.assign(SW, { active: true, el, bg, id: c.id, x0: c.x, dx: 0, w: el.offsetWidth });
  moveSwipe(x);
}
function swipeLimit() { return Math.min(120, SW.w * 0.36); }
function moveSwipe(x) {
  SW.dx = Math.min(0, x - SW.x0);
  SW.el.style.transform = `translateX(${SW.dx}px)`;
  SW.bg.classList.toggle("armed", -SW.dx > swipeLimit());
}
function endSwipe(cancel) {
  const { el, bg, id } = SW;
  const del = !cancel && -SW.dx > swipeLimit();
  SW.active = false;
  blockClick();
  el.classList.remove("swiping");
  if (del) {
    el.classList.add("swipe-out");
    el.style.transform = "translateX(-105%)";
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) {}
  } else {
    el.classList.add("swipe-back");
    el.style.transform = "";
  }
  setTimeout(() => {
    bg.remove(); el.classList.remove("swipe-back", "swipe-out"); el.style.transform = "";
    S.renderBlocked = false;
    if (del) deleteTask(id); else if (S.renderPending) { S.renderPending = false; render(); }
  }, 200);
}

// ---------- Dra og slipp ----------
function startDrag(x, y) {
  const c = DRAG.cand; if (!c) return;
  clearTimeout(c.timer); DRAG.cand = null;
  if (!getTask(c.id) || !document.body.contains(c.el)) return;
  closePopover();
  const ae = document.activeElement; if (ae && ae.blur && ae !== document.body) ae.blur();
  DRAG.active = true; DRAG.id = c.id; DRAG.src = c.el;
  S.renderBlocked = true;
  const r = c.el.getBoundingClientRect();
  const g = c.el.cloneNode(true);
  g.classList.add("drag-ghost"); g.classList.remove("just-done");
  const w = Math.min(Math.max(r.width, 160), 320);
  g.style.width = w + "px";
  DRAG.offX = Math.min(Math.max(c.x - r.left, 12), w - 12);
  DRAG.offY = Math.min(c.y - r.top, 40);
  document.body.appendChild(g);
  DRAG.ghost = g;
  c.el.classList.add("drag-src");
  document.body.classList.add("is-dragging");
  // Husk opprinnelig plass (blant oppgavene uten klokkeslett) for å se om noe faktisk endret seg
  const t = getTask(c.id);
  DRAG.origDate = t.date || null;
  const parentList = c.el.parentElement;
  const sib = parentList ? [...parentList.children].filter(n => n.dataset && n.dataset.task && !n.dataset.timed) : [];
  const i = sib.indexOf(c.el);
  DRAG.origPrev = i > 0 ? sib[i - 1].dataset.task : null;
  DRAG.origNext = i >= 0 && i < sib.length - 1 ? sib[i + 1].dataset.task : null;
  DRAG.line = document.createElement("div"); DRAG.line.className = "drop-line";
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
  DRAG.x = x; DRAG.y = y;
  moveDrag();
  DRAG.raf = requestAnimationFrame(autoScroll);
}
function moveDrag() {
  const g = DRAG.ghost; if (!g) return;
  g.style.transform = `translate3d(${DRAG.x - DRAG.offX}px, ${DRAG.y - DRAG.offY}px, 0) rotate(1.5deg)`;
  const hit = document.elementFromPoint(DRAG.x, DRAG.y);
  const zone = hit ? hit.closest("[data-drop-date]") : null;
  if (zone !== DRAG.zone) {
    if (DRAG.zone) DRAG.zone.classList.remove("drop-hover");
    DRAG.zone = zone;
    if (zone) zone.classList.add("drop-hover");
  }
  let list = null;
  if (zone) list = zone.matches("[data-list]") ? zone : zone.querySelector("[data-list]");
  if (list && list.dataset.noreorder) list = null;
  const tk = getTask(DRAG.id);
  const dated = !!(zone && zone.dataset.dropDate);
  // Oppgaver med klokkeslett plasseres etter tid, så de får ingen plasseringslinje
  if (list && dated && tk && tk.time) list = null;
  DRAG.list = list;
  if (!list) { if (DRAG.line.parentNode) DRAG.line.remove(); return; }
  const kids = [...list.children].filter(n => n.dataset && n.dataset.task && n !== DRAG.src);
  const movable = dated ? kids.filter(n => !n.dataset.timed) : kids;
  let before = null;
  for (const it of movable) { const rr = it.getBoundingClientRect(); if (DRAG.y < rr.top + rr.height / 2) { before = it; break; } }
  if (!before && dated) before = kids.find(n => n.dataset.timed) || null;   // aldri under oppgavene med klokkeslett
  if (before) { if (DRAG.line.nextSibling !== before || DRAG.line.parentNode !== list) list.insertBefore(DRAG.line, before); }
  else if (DRAG.line.parentNode !== list || DRAG.line.nextSibling) list.appendChild(DRAG.line);
}
function autoScroll() {
  if (!DRAG.active) return;
  const tb = document.querySelector(".topbar").getBoundingClientRect().bottom;
  const topEdge = tb + 45, botEdge = innerHeight - 80;
  let dy = 0;
  if (DRAG.y < topEdge) dy = -Math.min(22, Math.ceil((topEdge - DRAG.y) / 5));
  else if (DRAG.y > botEdge) dy = Math.min(22, Math.ceil((DRAG.y - botEdge) / 4));
  if (dy) { window.scrollBy(0, dy); moveDrag(); }
  DRAG.raf = requestAnimationFrame(autoScroll);
}
function endDrag(commit) {
  cancelAnimationFrame(DRAG.raf);
  const id = DRAG.id, zone = DRAG.zone, list = DRAG.list, line = DRAG.line;
  let target = null;
  if (commit && zone) {
    const newDate = zone.dataset.dropDate || null;
    let order = null, prevId = null, nextId = null;
    if (list && line && line.parentNode === list) {
      const ids = []; let idx = -1;
      for (const ch of list.children) {
        if (ch === line) { idx = ids.length; continue; }
        const tid = ch.dataset && ch.dataset.task;
        if (tid && tid !== id && !(newDate && ch.dataset.timed)) ids.push(tid);
      }
      prevId = idx > 0 ? ids[idx - 1] : null;
      nextId = idx >= 0 && idx < ids.length ? ids[idx] : null;
      const prev = prevId && getTask(prevId), next = nextId && getTask(nextId);
      if (prev && next) order = (prev.order + next.order) / 2;
      else if (prev) order = prev.order + 1;
      else if (next) order = next.order - 1;
      else order = 1;
    }
    target = { newDate, order, prevId, nextId };
  }
  if (DRAG.ghost) DRAG.ghost.remove();
  if (line && line.parentNode) line.remove();
  if (zone) zone.classList.remove("drop-hover");
  if (DRAG.src) DRAG.src.classList.remove("drag-src");
  document.body.classList.remove("is-dragging");
  DRAG.active = false; DRAG.ghost = null; DRAG.zone = null; DRAG.list = null; DRAG.src = null;
  blockClick();
  S.renderBlocked = false;
  if (target) {
    const sameDate = target.newDate === DRAG.origDate;
    const samePlace = sameDate && (target.order == null || (target.prevId === DRAG.origPrev && target.nextId === DRAG.origNext));
    if (!samePlace) moveTask(id, target.newDate, target.order);
  }
  render();
}

// =====================================================================
//  HENDELSER
// =====================================================================
document.addEventListener("click", (e) => {
  if (popEl && !e.target.closest(".popover") && !e.target.closest("#qa-date")) closePopover();
  const el = e.target.closest("[data-act],[data-task]");
  if (!el) return;
  if (!el.dataset.act) { if (!el.closest(".sheet")) openTask(el.dataset.task); return; }
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case "view": setView(d.view); break;
    case "menu": openMenu(); break;
    case "prev": nav(-1); break;
    case "next": nav(1); break;
    case "go-today": goToday(); break;
    case "back": setView(S.prevView || "uke"); break;
    case "qa-date": openQaPopover(); break;
    case "qa-pick": setQaDate(d.rel === "none" ? null : d.rel); break;
    case "qa-add": addFromQuick(); break;
    case "toggle": toggleDone(d.id); break;
    case "inline-add": {
      S.inlineAdd = d.date; renderContent();
      const inp = document.getElementById("ia-" + d.date); if (inp) inp.focus();
      break;
    }
    case "toggle-done-list": { const k = d.key; if (S.openDone.has(k)) S.openDone.delete(k); else S.openDone.add(k); renderContent(); break; }
    case "push-day": pushDay(d.date); break;
    case "select-day": S.selected = d.date; S.qaDate = d.date; S.inlineAdd = null; renderQuickAdd(); renderContent(); break;
    case "overdue-today": overdueToToday(); break;
    case "show-overdue": setView("liste"); break;
    case "hide-local": S.localNoticeHidden = true; lsSet("localNoticeHidden", true); renderBanners(); break;
    case "dismiss-error": S.error = ""; renderBanners(); break;
    case "search-done": S.doneSearch = S.search; S.toolbarSig = ""; setView("utfort"); break;
    case "load-done": loadOlderDone(false); break;
    case "load-all-done": loadOlderDone(true); break;
    case "close-sheet": closeSheetUI(); break;
    case "set-date": if (S.sheet && S.sheet.kind === "task") setTaskDate(S.sheet.id, d.rel); break;
    case "delete-task": {
      if (S.sheet && S.sheet.kind === "task") deleteTask(S.sheet.id);
      break;
    }
    case "del": deleteTask(d.id); break;
    case "clear-time": {
      if (S.sheet && S.sheet.kind === "task") update(S.sheet.id, { time: null });
      break;
    }
    case "add-image": if (S.sheet && S.sheet.kind === "task") { S.fileTarget = S.sheet.id; $("#file-input").click(); } break;
    case "view-image": if (S.sheet && S.sheet.kind === "task") openLightbox(S.sheet.id, d.img); break;
    case "lb-close": popOverlayUI(); break;
    case "lb-prev": lbStep(-1); break;
    case "lb-next": lbStep(1); break;
    case "lb-delete": {
      if (!S.lb) break;
      if (!S.lb.confirm) { S.lb.confirm = true; drawLightbox(); break; }
      const t = getTask(S.lb.taskId); const im = t && t.images[S.lb.idx];
      if (im) removeImage(t.id, im.id);
      S.lb.confirm = false;
      const left = getTask(S.lb.taskId);
      if (!left || !left.images.length) popOverlayUI(); else drawLightbox();
      break;
    }
    case "secure": accountAction("secure"); break;
    case "login": accountAction("login"); break;
    case "logout": store.logout().catch(e => toast(authError(e), { kind: "error" })); S.accountMsg = ""; break;
  }
});
document.addEventListener("click", (e) => {
  const inp = e.target;
  if (inp && inp.tagName === "INPUT" && inp.type === "date" && typeof inp.showPicker === "function") { try { inp.showPicker(); } catch (err) {} }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "file-input") { const id = S.fileTarget; const files = [...t.files]; t.value = ""; if (id && files.length) addImages(id, files); }
  else if (t.id === "d-date-input") { if (S.sheet && S.sheet.kind === "task") setTaskDate(S.sheet.id, t.value || "none"); }
  else if (t.id === "d-time") { if (S.sheet && S.sheet.kind === "task") update(S.sheet.id, { time: /^\d{2}:\d{2}$/.test(t.value) ? t.value : null }); }
  else if (t.id === "qa-date-input") { if (t.value) setQaDate(t.value); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "search") { S.search = e.target.value; renderContent(); }
  else if (e.target.id === "done-search") { S.doneSearch = e.target.value; renderContent(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (DRAG.active) { endDrag(false); return; }
    if (popEl) { closePopover(); return; }
    if (S.lb) { popOverlayUI(); return; }
    if (S.sheet) { closeSheetUI(); return; }
    if (S.inlineAdd) { S.inlineAdd = null; renderContent(); return; }
    return;
  }
  if (e.isComposing) return;
  const tg = e.target;
  if (tg.id === "qa-input" && e.key === "Enter") { e.preventDefault(); addFromQuick(); return; }
  if (tg.classList && tg.classList.contains("ia-input")) {
    if (e.key === "Enter") {
      e.preventDefault();
      const key = tg.dataset.date, v = tg.value;
      if (v.trim()) { tg.value = ""; createTask(v, key === "none" ? null : key); }
      else { S.inlineAdd = null; renderContent(); }
    }
    return;
  }
  if (S.lb) { if (e.key === "ArrowLeft") lbStep(-1); else if (e.key === "ArrowRight") lbStep(1); return; }
  if ((tg.id === "acc-pass" || tg.id === "login-pass") && e.key === "Enter") { accountAction(tg.id === "acc-pass" ? "secure" : "login"); return; }
  const typing = tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.isContentEditable;
  if (typing || S.sheet || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowLeft") { nav(-1); }
  else if (e.key === "ArrowRight") { nav(1); }
  else if (e.key === "n" || e.key === "N") { e.preventDefault(); $("#qa-input").focus(); }
  else if ((e.key === "Enter" || e.key === " ") && tg.dataset && tg.dataset.task) { e.preventDefault(); openTask(tg.dataset.task); }
});
document.addEventListener("focusout", (e) => {
  const tg = e.target;
  if (!tg.classList || !tg.classList.contains("ia-input") || S.renderingNow) return;
  const id = tg.id, key = tg.dataset.date, v0 = tg.value;
  setTimeout(() => {
    const cur = document.getElementById(id);
    if (cur && document.activeElement === cur) return;   // fortsatt i feltet (f.eks. etter at listen ble tegnet på nytt)
    const v = cur ? cur.value : v0;
    if (S.inlineAdd === key) S.inlineAdd = null;
    if (v.trim()) createTask(v, key === "none" ? null : key);   // tekst som ikke er lagt til, blir lagret i stedet for å forsvinne
    renderContent();
  }, 150);
});
document.addEventListener("paste", (e) => {
  // Lim inn en liste i et legg-til-felt: hver linje blir en egen oppgave
  const tg = e.target;
  if (tg && (tg.id === "qa-input" || (tg.classList && tg.classList.contains("ia-input")))) {
    const text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
    if (text && /\n/.test(text.trim())) {
      e.preventDefault();
      const date = tg.id === "qa-input" ? S.qaDate : (tg.dataset.date === "none" ? null : tg.dataset.date);
      addMany(text, date);
    }
    return;
  }
  if (!S.sheet || S.sheet.kind !== "task") return;
  const files = [...(e.clipboardData && e.clipboardData.items || [])].filter(i => i.kind === "file" && i.type.startsWith("image/")).map(i => i.getAsFile()).filter(Boolean);
  if (files.length) { e.preventDefault(); addImages(S.sheet.id, files); }
});
window.addEventListener("online", () => { S.offline = false; renderBanners(); });
window.addEventListener("offline", () => { S.offline = true; renderBanners(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkNewDay(); });
setInterval(checkNewDay, 30000);
function checkNewDay() {
  const t = todayKey();
  if (t === S.lastToday) return;
  const old = S.lastToday; S.lastToday = t;
  if (S.qaDate === old) S.qaDate = t;
  if (S.anchor === old) S.anchor = t;
  if (S.selected === old) S.selected = t;
  S.toolbarSig = "";
  render();
}

// =====================================================================
//  OPPSTART
// =====================================================================
$("#logo").innerHTML = svg("check", "", 3);
$("#done-ic").outerHTML = svg("done");
$("#btn-menu").innerHTML = svg("menu");
$("#qa-icon").innerHTML = svg("plus");
$("#qa-submit").insertAdjacentHTML("beforeend", svg("plus"));

const hooks = {
  onTasks(list) {
    S.live = new Map(list.map(t => [t.id, t]));
    S.loaded = true;
    cleanupDeleted();
    scheduleRender();
  },
  onReset() {
    S.live = new Map(); S.older = new Map(); S.fetched = new Set();
    S.doneCursor = null; S.allDoneLoaded = false; S.loaded = false;
    if (S.sheet && S.sheet.kind === "task") closeSheetUI();
    scheduleRender();
  },
  onUser(u) { S.user = u; renderMenuSheet(); },
  onError(e) { console.error(e); S.error = errorText(e); S.loaded = true; scheduleRender(); },
};

async function boot() {
  render();
  try {
    store = LOCAL_MODE ? createLocalStore() : await createFirebaseStore();
  } catch (e) {
    console.error(e);
    S.error = "Fikk ikke lastet Firebase. Sjekk nettforbindelsen og last inn siden på nytt.";
    S.loaded = true; render(); return;
  }
  store.start(hooks);
}
boot();

if ("serviceWorker" in navigator && location.protocol === "https:" && !params.has("nosw")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
